<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="shortcut icon" href="images/Favicon.svg" type="image/x-icon">
        <link rel="stylesheet" href="scripts/style/style.css">
        
        <script type="module" src="scripts/firestore.js"></script>
        <script type="module" src="scripts/global.d.js"></script>

        <title>Atp</title>
    </head>
    <body>
        <div class="Topbar">
            <div Active href="Products" class="Button Products">Ürünler</div>
            <div href="Profile" class="Button Profile"><span>Profil</span></div>
            <div href="Cart" class="Button Cart"><span>Sepet</span><span>•</span><span class="Total">0,00₺</span></div>
        </div>
        <div class="Frames">
            <div href="Products">
                <div class="TextPrompt"><input placeholder="Ürün ara"></input></div>
                <div class="Items"></div>
            </div>
            <div style="display: none;" href="Profile"></div>
            <div style="display: none;" href="Cart"></div>
        </div>
        <div style="display: none;" class="ProductDisplay">
            <div class="Images"></div>
            <div class="Text">
                <span class="Name">Name</span>
                <span class="Description">Description</span>
                <div class="Align">
                    <div class="Seller">Seller</div>
                    <div class="Rating">0.0<img src="images/Star.svg"></div>
                    <div class="Price">0,00₺</div>
                </div>
            </div>
        </div>
    </body>
</html>
